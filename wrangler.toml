name = "revelytics"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

# Auto-build frontend before deploying
[build]
command = "npm run build"

# Static Frontend Assets (serves the React UI on revelytics.mkmkataria07.workers.dev)
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "revlytics-db"
database_id = "6f0f1928-9284-4184-8b0e-333ada672515"

# Environment variables
[vars]
ENVIRONMENT = "production"
API_URL = "https://revelytics.mkmkataria07.workers.dev"
